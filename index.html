    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      /* Aggressively hide scrollbars globally */
      html, body {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
        overflow-x: hidden !important;
        width: 100%;
        position: relative;
        margin: 0;
        padding: 0;
      }

      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }

      /* Utility classes for specific elements */
      .no-scrollbar::-webkit-scrollbar,
      .scrollbar-hide::-webkit-scrollbar {
        display: none !important;
      }
      .no-scrollbar,
      .scrollbar-hide {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }

      body {
        font-family: 'Inter', sans-serif;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      /* Map Specific Styles */
      .leaflet-container {
        width: 100%;
        height: 100%;
        background: #0f172a;
        font-family: 'Inter', sans-serif;
      }
      .leaflet-control-attribution {
        background: rgba(255, 255, 255, 0.8) !important;
        font-size: 10px;
        padding: 0 4px;
        border-radius: 4px;
      }

      /* Prevent layout shift from scrollbar hiding */
      html {
        scrollbar-gutter: auto;
      }
      /* But wait, if we hide them, stable might still reserve space. 
         Actually, with scrollbar-width: none, stable should be ignored or work correctly.
         Let's try without it first if the user wants them GONE.
      */
